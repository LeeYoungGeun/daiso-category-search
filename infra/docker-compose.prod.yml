# docker-compose.prod.yml — 라이브 배포용
# 사용법:
#   cp .env.live .env
#   cd infra && docker compose -f docker-compose.prod.yml up -d --build
#   또는: docker compose -f infra/docker-compose.prod.yml up -d --build

services:
  # ── Nginx Reverse Proxy ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    restart: always
    networks:
      - daiso-net

  # ── FastAPI Backend ─────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: >
      gunicorn backend.main:app --worker-class uvicorn.workers.UvicornWorker --workers 3 --bind 0.0.0.0:8000 --timeout 30 --preload
    env_file:
      - ../.env
    volumes:
      - ../backend/database:/app/backend/database:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - daiso-net

  # ── Next.js Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - daiso-net

  # ── Elasticsearch (BM25 검색) ──────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: daiso-elasticsearch-prod
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - cluster.name=daiso-search
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - daiso-net

  # ── Qdrant (Vector 검색) ───────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: daiso-qdrant-prod
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - daiso-net

  # ── Redis (캐시/세션) ──────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: daiso-redis-prod
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - daiso-net

volumes:
  es_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local

networks:
  daiso-net:
    driver: bridge
