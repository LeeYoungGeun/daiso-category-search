# nginx-host.conf — 서버 A 호스트 Nginx 설정
# 설치 방법:
#   sudo cp infra/nginx-host.conf /etc/nginx/sites-available/daiso
#   sudo ln -s /etc/nginx/sites-available/daiso /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default  # 기본 설정 제거
#   sudo nginx -t && sudo systemctl reload nginx
#
# 도메인 사용 시: server_name을 실제 도메인으로 변경
# SSL 적용 시: certbot 사용
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com

upstream api_backend {
    server 127.0.0.1:8000;
}

upstream frontend_app {
    server 127.0.0.1:3000;
}

# WebSocket upgrade 맵
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP 서버 ──
# 도메인 + SSL 적용 전까지 HTTP로 서비스
# SSL 적용 후에는 HTTPS 리다이렉트로 변경
server {
    listen 80;
    server_name 3.39.6.105;  # 도메인 사용 시: your-domain.com

    # ── API 엔드포인트 ──
    location /v1/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /ml/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api_backend;
    }

    # ── WebSocket (STT 스트리밍) ──
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Frontend (기본 경로) ──
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTPS 서버 (SSL 적용 후 활성화) ──
# certbot이 자동으로 이 블록을 생성합니다.
# 수동 설정 시 아래 주석을 해제하세요:
#
# server {
#     listen 443 ssl;
#     server_name your-domain.com;
#
#     ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
#
#     # 위 location 블록들을 여기에 복사
# }
