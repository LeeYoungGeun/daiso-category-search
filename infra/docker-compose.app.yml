# 서버 A (3.39.6.105) 에서 실행
#   cd ~/daiso-category-search
#   docker compose -f infra/docker-compose.app.yml up -d --build --force-recreate
#
# Nginx는 호스트에 직접 설치 (이 파일에 포함 안 됨)

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: daiso-api
    command: >
      gunicorn backend.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 1
      --bind 0.0.0.0:8000
      --timeout 60
      --worker-tmp-dir /tmp
      --control-socket /tmp/gunicorn.ctl
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/daisoproject-sst.json
    volumes:
      - ../backend/database:/app/backend/database:ro
      - ../secrets/daisoproject-sst.json:/run/secrets/daisoproject-sst.json:ro
    restart: always
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://3.39.6.105
    container_name: daiso-frontend
    ports:
      - "3000:3000"
    restart: always
    mem_limit: 256m

