# docker-compose.app.yml — 서버 A (App) 전용
# 사용법:
#   서버 A (3.39.6.105) 에서 실행
#   docker compose -f infra/docker-compose.app.yml up -d --build
#
# Nginx는 호스트에 직접 설치 (이 파일에 포함 안 됨)

services:
  # ── FastAPI Backend ─────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: daiso-api
    command: >
      gunicorn backend.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8000 --timeout 60 --preload
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend/database/products.db:/app/backend/database/products.db:ro
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Next.js Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # 도메인 사용 시: NEXT_PUBLIC_API_URL=https://your-domain.com
        NEXT_PUBLIC_API_URL: http://3.39.6.105
    container_name: daiso-frontend
    ports:
      - "3000:3000"
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M
