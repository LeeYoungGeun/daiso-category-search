# backend/config.yaml
# STT Pipeline Configuration
# PoC Phase 1: Batch processing with Whisper medium

stt:
  whisper:
    model_size: "base"  # Lightsail 2GB RAM 최적화: medium(~1.5GB) → base(~150MB)
    device: "cpu"
    compute_type: "int8"
    fallback_model: "tiny"  # base OOM 시 tiny(~75MB)로 fallback
    language: "ko"
  
  google:
    credentials_path: "google_key.json"  # Path to Service Account JSON
    language_code: "ko-KR"
    
quality_gate:
  min_chars: 2
  min_confidence: 0.6
  nonsense_patterns:
    - "(ㅋ|ㅎ){3,}"
    - "(ㅇ){3,}"
    - "[!?]{3,}"
    - "^(아+|음+|어+|그+)$"

policy_gate:
  fixed_locations:
    - keyword: "화장실"
      target: "restroom"
      response: "화장실은 매장 뒤쪽 왼편에 있습니다."
    - keyword: "계산대"
      target: "checkout"
      response: "계산대는 매장 출구 쪽에 있습니다."
    - keyword: "입구"
      target: "entrance"
      response: "입구는 정면입니다."
    - keyword: "출구"
      target: "exit"
      response: "출구는 계산대 쪽입니다."
  
  unsupported_patterns:
    - "배달"
    - "교환"
    - "환불"
    - "영업시간"
    - "반품"
  
  fallback_message: "이 서비스는 상품과 매장 내 위치 안내를 도와드리고 있어요. 찾고 계신 물건이나 장소를 말씀해 주세요!"
  retry_message: "말씀을 잘 듣지 못했어요. 찾고 계신 상품을 다시 말씀해 주세요."

# ── STT 고도화 설정 (poc/lsy/config.yaml에서 병합) ──────────────────────────
# 전처리: AudioPreprocessor가 읽음
preprocessing:
  volume_normalize: true
  target_dBFS: -20
  noise_reduction: false          # 기본 OFF, 노이즈 심한 환경에서만 true

# 후처리: TextPostprocessor가 읽음
postprocessing:
  enabled: true
  apply_to_google: true
  apply_to_fallback: true
  remove_fillers: true            # 추임새 제거 (음, 어, 그...)
  normalize_units: true           # 단위 정규화 (미리→ml)
  cleanup_whitespace: true

# Whisper Fallback: Google Streaming 실패 시 로컬 Whisper로 전환
# poc/lsy/ws_stt.py의 WhisperFallbackManager가 읽음
fallback:
  enabled: true
  buffer_max_sec: 15              # Ring buffer 최대 유지 (초)
  whisper:
    model_size: "base"            # Lightsail 2GB RAM 최적화: medium → base (~150MB)
    device: "cpu"                 # Lightsail: cpu, GPU 있으면 cuda
    compute_type: "int8"
    fallback_model: "tiny"        # base OOM 시 tiny(~75MB)로 fallback
    language: "ko"
  preprocess:
    volume_normalize: true
    target_dBFS: -20
    denoise: true
  postprocess: true               # postprocessing 설정 따름
